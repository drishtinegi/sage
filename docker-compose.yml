services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: explain
      POSTGRES_PASSWORD: explain
      POSTGRES_DB: explainback
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explain -d explainback"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://explain:explain@db:5432/explainback
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./prompts:/prompts
      - ./evals:/evals
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: